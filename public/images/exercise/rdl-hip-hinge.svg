<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Romanian Deadlift hip hinge">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">RDL: HIP HINGE, NEUTRAL SPINE</text>
  <line x1="40" y1="205" x2="320" y2="205" stroke="#2a2a2a" stroke-width="2"/>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="160" cy="60" r="10"/>
    <line x1="160" y1="70" x2="160" y2="110"/>
    <line x1="160" y1="110" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="130" y2="205"/>
    <line x1="150" y1="150" x2="190" y2="205"/>
    <line x1="150" y1="150" x2="160" y2="120"/>
  </g>
  <g stroke="#f39c12" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="160" y1="115" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="90" y2="205"/>
    <line x1="150" y1="150" x2="110" y2="205"/>
  </g>
  <rect x="70" y="185" width="55" height="18" rx="4" fill="#f39c12"/>
  <text x="97" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#0b0b0b">BAR</text>
  <path d="M150 152 Q 100 175 95 185" fill="none" stroke="#4f8ef7" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="200" y="85" font-family="monospace" font-size="10" fill="#7a7a7a">neutral spine</text>
  <text x="60" y="60" font-family="monospace" font-size="10" fill="#f39c12">hips back</text>
</svg>
