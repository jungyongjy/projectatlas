<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Bulgarian Split Squat stance">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">BULGARIAN SPLIT SQUAT: STANCE</text>
  <line x1="40" y1="200" x2="200" y2="200" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="200" y="150" width="120" height="50" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="260" y="142" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">bench</text>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="130" cy="65" r="10"/>
    <line x1="130" y1="75" x2="130" y2="120"/>
    <line x1="130" y1="90" x2="110" y2="115"/>
    <line x1="130" y1="90" x2="150" y2="115"/>
    <line x1="130" y1="120" x2="110" y2="175"/>
    <line x1="130" y1="120" x2="150" y2="175"/>
  </g>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="110" y1="175" x2="90" y2="200"/>
    <line x1="150" y1="175" x2="260" y2="185"/>
    <line x1="260" y1="185" x2="265" y2="200"/>
  </g>
  <text x="90" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">front foot</text>
  <text x="268" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">rear foot on bench</text>
</svg>
