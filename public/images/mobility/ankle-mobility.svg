  <text x="90" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a7a">dorsiflexion</text>
  <text x="90" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a7a">plantar flexion</text>
  <line x1="90" y1="85" x2="90" y2="190" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="95" r="8" fill="#1f1f1f" stroke="#2a2a2a" stroke-width="3"/>
  <path d="M90 103 L 70 108" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 103 L 112 106" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="108" x2="70" y2="120" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <line x1="112" y1="106" x2="112" y2="120" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 124 L 112 124" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 130 L 70 160" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 130 L 112 158" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 160 L 70 150" stroke="#4f8ef7" stroke-width="2"/>
  <line x1="90" y1="130" x2="90" y2="118" stroke="#4f8ef7" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M70 162 L 70 172" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 160 L 112 172" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="176" x2="112" y2="176" stroke="#4f8ef7" stroke-width="3" stroke-linecap="round"/>
  <path d="M68 92 C 66 100, 66 108, 68 114" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M112 90 C 114 98, 114 106, 112 112" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <g>
    <circle cx="270" cy="120" r="30" fill="none" stroke="#4f8ef7" stroke-width="3"/>
    <circle cx="270" cy="120" r="18" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <path d="M270 90 A 30 30 0 0 1 292 140" stroke="#f39c12" stroke-width="3" fill="none"/>
    <polygon points="292,140 284,138 289,147" fill="#f39c12"/>
    <text x="270" y="200" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a7a">ankle circles</text>
    <text x="270" y="216" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">both directions</text>
  </g>
  <text x="180" y="234" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">2 x 20 seconds each direction, daily</text>
