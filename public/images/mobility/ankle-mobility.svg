<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Ankle mobility exercises: dorsiflexion, plantar flexion, and circles">
  <rect width="360" height="240" rx="12" fill="#161616"/>
