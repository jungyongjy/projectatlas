<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Warm-up sequence: dynamic movement before training">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">WARM-UP SEQUENCE</text>
  <g stroke="#2a2a2a" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="55" x2="70" y2="195"/>
    <line x1="160" y1="55" x2="160" y2="195"/>
    <line x1="250" y1="55" x2="250" y2="195"/>
  </g>
  <text x="70" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f8ef7">1. pulse</text>
  <text x="160" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f8ef7">2. mobilise</text>
  <text x="250" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f8ef7">3. activate</text>
  <path d="M70 70 C 60 78, 80 86, 70 94 C 60 102, 80 110, 70 118 C 60 126, 80 134, 70 142" stroke="#4f8ef7" stroke-width="3" fill="none"/>
  <text x="70" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">light jog</text>
  <text x="70" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">2–3 min</text>
  <g stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="160" cy="75" r="7"/>
    <line x1="160" y1="82" x2="160" y2="100"/>
    <line x1="160" y1="86" x2="152" y2="96"/>
    <line x1="160" y1="86" x2="168" y2="96"/>
    <line x1="160" y1="100" x2="150" y2="130"/>
    <line x1="160" y1="100" x2="170" y2="130"/>
    <path d="M150 130 L 170 130" stroke="#4f8ef7" stroke-width="2"/>
  </g>
  <text x="160" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">dynamic drills</text>
  <text x="160" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">leg swings, lunges</text>
  <g stroke="#4f8ef7" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="238" y1="80" x2="238" y2="118"/>
    <line x1="238" y1="90" x2="244" y2="106"/>
    <line x1="238" y1="90" x2="232" y2="106"/>
    <line x1="238" y1="118" x2="232" y2="132"/>
    <line x1="238" y1="118" x2="244" y2="132"/>
    <line x1="262" y1="80" x2="262" y2="118"/>
    <line x1="262" y1="90" x2="268" y2="106"/>
    <line x1="262" y1="90" x2="256" y2="106"/>
    <line x1="262" y1="118" x2="256" y2="132"/>
    <line x1="262" y1="118" x2="268" y2="132"/>
    <path d="M232 132 L 268 132" stroke="#4f8ef7" stroke-width="2"/>
  </g>
  <text x="250" y="166" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">first exercise</text>
  <text x="250" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">warm-up sets</text>
  <path d="M86 130 L 144 130" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="146,130 137,126 137,134" fill="#2a2a2a"/>
  <path d="M176 130 L 234 130" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="236,130 227,126 227,134" fill="#2a2a2a"/>
  <text x="180" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">raise body temperature before loading</text>
</svg>
