<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Thoracic spine rotation stretch">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">THORACIC ROTATION</text>
  <line x1="50" y1="200" x2="310" y2="200" stroke="#2a2a2a" stroke-width="2"/>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="120" cy="60" r="9"/>
    <line x1="120" y1="69" x2="120" y2="100"/>
    <line x1="120" y1="100" x2="110" y2="135"/>
    <line x1="110" y1="135" x2="105" y2="200"/>
    <line x1="110" y1="100" x2="140" y2="120"/>
    <line x1="140" y1="120" x2="150" y2="180"/>
  </g>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="105" y1="200" x2="95" y2="200"/>
    <line x1="150" y1="180" x2="150" y2="200"/>
  </g>
  <path d="M140 115 Q 175 130 210 120" fill="none" stroke="#f39c12" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>
  <polygon points="210,120 203,115 204,125" fill="#f39c12"/>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35">
    <circle cx="230" cy="60" r="9"/>
    <line x1="230" y1="69" x2="230" y2="100"/>
    <line x1="230" y1="100" x2="222" y2="135"/>
    <line x1="222" y1="135" x2="218" y2="200"/>
  </g>
  <text x="180" y="220" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a7a">rotate the spine, not the hips</text>
</svg>
