<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Recovery mobility, when to use gentle movement versus rest">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">RECOVERY MOBILITY</text>
  <rect x="30" y="70" width="140" height="130" rx="8" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="100" y="92" text-anchor="middle" font-family="monospace" font-size="11" fill="#2ecc71">MOVE</text>
  <g stroke="#2ecc71" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="100" cy="122" r="8"/>
    <line x1="100" y1="130" x2="100" y2="152"/>
    <line x1="100" y1="136" x2="92" y2="144"/>
    <line x1="100" y1="136" x2="108" y2="144"/>
    <line x1="100" y1="152" x2="92" y2="170"/>
    <line x1="100" y1="152" x2="108" y2="170"/>
  </g>
  <text x="100" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">general soreness</text>
  <text x="100" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">blood-flow movement</text>
  <rect x="190" y="70" width="140" height="130" rx="8" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="260" y="92" text-anchor="middle" font-family="monospace" font-size="11" fill="#f39c12">REST</text>
  <g stroke="#f39c12" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="260" cy="122" r="8"/>
    <line x1="260" y1="130" x2="260" y2="152"/>
    <line x1="260" y1="136" x2="252" y2="144"/>
    <line x1="260" y1="136" x2="268" y2="144"/>
    <line x1="260" y1="152" x2="252" y2="170"/>
    <line x1="260" y1="152" x2="268" y2="170"/>
    <path d="M236 108 L 284 108" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  <text x="260" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">sharp pain, swelling</text>
  <text x="260" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">do not stretch through it</text>
  <text x="180" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">gentle mobility helps recovery; pain is a stop signal</text>
</svg>
