<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Calf stretch against a wall">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">CALF STRETCH AGAINST WALL</text>
  <rect x="300" y="80" width="18" height="120" rx="3" fill="#2a2a2a"/>
  <line x1="50" y1="200" x2="320" y2="200" stroke="#2a2a2a" stroke-width="2"/>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="170" cy="60" r="10"/>
    <line x1="170" y1="70" x2="170" y2="115"/>
    <line x1="170" y1="85" x2="150" y2="110"/>
    <line x1="170" y1="85" x2="190" y2="110"/>
    <line x1="170" y1="115" x2="160" y2="160"/>
    <line x1="170" y1="115" x2="185" y2="160"/>
  </g>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="160" y1="160" x2="125" y2="200"/>
    <line x1="185" y1="160" x2="155" y2="200"/>
  </g>
  <line x1="300" y1="95" x2="150" y2="120" stroke="#f39c12" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="255" y="70" font-family="monospace" font-size="10" fill="#f39c12">wall</text>
  <text x="60" y="220" font-family="monospace" font-size="10" fill="#7a7a7a">back heel down</text>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#7a7a7a">front knee bent</text>
</svg>
