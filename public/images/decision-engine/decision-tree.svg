<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Decision tree flow, if-then guidance branching">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">IF-THEN DECISION TREE</text>
  <rect x="125" y="48" width="110" height="30" rx="6" fill="#4f8ef7"/>
  <text x="180" y="67" text-anchor="middle" font-family="monospace" font-size="11" fill="#0b0b0b">situation</text>
  <line x1="180" y1="78" x2="180" y2="96" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="180" y1="96" x2="90" y2="96" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="180" y1="96" x2="270" y2="96" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="90" y1="96" x2="90" y2="116" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="270" y1="96" x2="270" y2="116" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="45" y="116" width="90" height="34" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="90" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#f39c12">yes</text>
  <rect x="225" y="116" width="90" height="34" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="270" y="138" text-anchor="middle" font-family="monospace" font-size="10" fill="#2ecc71">no</text>
  <line x1="90" y1="150" x2="90" y2="168" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="270" y1="150" x2="270" y2="168" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="45" y="168" width="90" height="30" rx="6" fill="#2ecc71"/>
  <text x="90" y="187" text-anchor="middle" font-family="monospace" font-size="10" fill="#0b0b0b">train on</text>
  <rect x="225" y="168" width="90" height="30" rx="6" fill="#f39c12"/>
  <text x="270" y="187" text-anchor="middle" font-family="monospace" font-size="10" fill="#0b0b0b">adjust</text>
  <text x="180" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">clear rules remove in-the-moment guesswork</text>
</svg>
