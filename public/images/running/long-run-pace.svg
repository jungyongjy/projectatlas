<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Long run, a steady conversational pace maintained for distance">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">LONG RUN</text>
  <path d="M40 160 C 120 150, 180 150, 320 140" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M40 160 L 40 100" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="3,4"/>
  <path d="M180 150 L 180 95" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="3,4"/>
  <path d="M320 140 L 320 88" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="3,4"/>
  <text x="40" y="88" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">start</text>
  <text x="180" y="84" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">steady</text>
  <text x="320" y="78" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">finish</text>
  <line x1="40" y1="190" x2="320" y2="190" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="180" y="210" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">7–10 km at a pace you could hold in conversation</text>
  <text x="180" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">even effort, no surges</text>
</svg>
