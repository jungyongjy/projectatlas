<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Threshold run, a continuous comfortably hard effort">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">THRESHOLD RUN</text>
  <line x1="40" y1="180" x2="320" y2="180" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M40 150 L 320 150" stroke="#4f8ef7" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 120 L 120 120" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 120 L 200 120" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 120 L 280 120" stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">warm-up</text>
  <text x="160" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#f39c12">threshold block</text>
  <text x="240" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">cool-down</text>
  <text x="40" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">0</text>
  <text x="160" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">20–40 min continuous</text>
  <text x="180" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">"comfortably hard" pace you could hold for an hour</text>
</svg>
