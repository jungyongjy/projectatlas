<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Zone 2 versus threshold intensity">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">INTENSITY: ZONE 2 vs THRESHOLD</text>
  <text x="60" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#7a7a7a">Zone 2</text>
  <rect x="30" y="95" width="120" height="22" rx="4" fill="#4f8ef7"/>
  <text x="90" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#0b0b0b">easy, conversational</text>
  <text x="300" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#f39c12">Threshold</text>
  <rect x="220" y="95" width="110" height="22" rx="4" fill="#f39c12"/>
  <text x="275" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#0b0b0b">comfortably hard</text>
  <text x="90" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">60–70% max HR</text>
  <text x="275" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">85–90% max HR</text>
  <text x="90" y="175" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">hours per week</text>
  <text x="275" y="175" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">20–40 min sessions</text>
  <text x="180" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#2ecc71">most weekly mileage lives in Zone 2</text>
</svg>
