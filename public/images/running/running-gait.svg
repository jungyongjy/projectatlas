<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Phases of the running gait cycle">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">RUNNING GAIT: STANCE AND SWING</text>
  <line x1="40" y1="195" x2="320" y2="195" stroke="#2a2a2a" stroke-width="2"/>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="120" cy="90" r="10"/>
    <line x1="120" y1="100" x2="120" y2="140"/>
    <line x1="120" y1="110" x2="100" y2="135"/>
    <line x1="120" y1="110" x2="140" y2="130"/>
    <line x1="120" y1="140" x2="105" y2="170"/>
    <line x1="120" y1="140" x2="145" y2="150"/>
  </g>
  <g stroke="#f39c12" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="105" y1="170" x2="95" y2="195"/>
    <line x1="145" y1="150" x2="165" y2="180"/>
  </g>
  <g stroke="#4f8ef7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35">
    <circle cx="240" cy="70" r="10"/>
    <line x1="240" y1="80" x2="240" y2="120"/>
    <line x1="240" y1="90" x2="255" y2="115"/>
    <line x1="240" y1="90" x2="225" y2="115"/>
    <line x1="240" y1="120" x2="255" y2="150"/>
    <line x1="240" y1="120" x2="225" y2="155"/>
  </g>
  <g stroke="#f39c12" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="225" y1="155" x2="235" y2="195"/>
    <line x1="255" y1="150" x2="270" y2="180"/>
  </g>
  <text x="100" y="222" text-anchor="middle" font-family="monospace" font-size="10" fill="#f39c12">stance (ground contact)</text>
  <text x="250" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#7a7a7a">swing (recovery)</text>
  <path d="M120 200 Q 165 205 225 200" fill="none" stroke="#4f8ef7" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="225,200 218,196 220,204" fill="#4f8ef7"/>
</svg>
