<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Norwegian 4x4 interval structure">
  <rect width="360" height="240" rx="12" fill="#161616"/>
  <text x="180" y="30" text-anchor="middle" font-family="monospace" font-size="13" fill="#7a7a7a">NORWEGIAN 4×4: WORK / REST</text>
  <g font-family="monospace" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="45" y="130">4 min</text>
    <text x="95" y="130">3 min</text>
    <text x="145" y="130">4 min</text>
    <text x="195" y="130">3 min</text>
    <text x="245" y="130">4 min</text>
    <text x="295" y="130">3 min</text>
    <text x="322" y="130">4 min</text>
  </g>
  <g stroke="#4f8ef7" stroke-width="0">
    <rect x="15" y="60" width="60" height="55" rx="4" fill="#4f8ef7"/>
    <rect x="95" y="90" width="40" height="25" rx="4" fill="#2a2a2a"/>
    <rect x="145" y="60" width="60" height="55" rx="4" fill="#4f8ef7"/>
    <rect x="225" y="90" width="40" height="25" rx="4" fill="#2a2a2a"/>
    <rect x="275" y="60" width="70" height="55" rx="4" fill="#4f8ef7"/>
  </g>
  <g font-family="monospace" font-size="10" fill="#7a7a7a" text-anchor="middle">
    <text x="45" y="145">85–95% max HR</text>
    <text x="115" y="145">active jog</text>
    <text x="175" y="145">85–95% max HR</text>
    <text x="245" y="145">active jog</text>
    <text x="310" y="145">85–95% max HR</text>
  </g>
  <text x="180" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#2ecc71">4 work intervals, each followed by an active recovery</text>
</svg>
